function render() {
  Renderer.update();
  renderUnitDetail();
  document.getElementById('wave-num').textContent = state.wave + 1;
  document.getElementById('score-num').textContent = state.score;
  document.getElementById('turn-info').textContent =
    state.phase === 'player_turn' ? `Turn ${state.turn} \u2014 Your Move` : 'Enemy Turn\u2026';
  document.getElementById('btn-end-turn').disabled = state.phase !== 'player_turn';
}

function renderUnitDetail() {
  const panel = document.getElementById('bottom-panel');
  const unit = state.selectedUnit;
  if (!unit) {
    panel.classList.remove('visible');
    return;
  }
  const isPlayer = state.playerUnits.includes(unit);
  const color = isPlayer ? FACTIONS[state.faction].color : (unit.color || '#ff5555');
  const totalAtk = unit.atk + (unit.bonusAtk || 0);
  const totalArmor = unit.armor + (unit.bonusArmor || 0);
  const totalMove = unit.move + (unit.bonusMove || 0);
  const atkBonus = unit.bonusAtk ? ` <span class="stat-bonus">+${unit.bonusAtk}</span>` : '';
  const armorBonus = unit.bonusArmor ? ` <span class="stat-bonus">+${unit.bonusArmor}</span>` : '';
  const moveBonus = unit.bonusMove ? ` <span class="stat-bonus">+${unit.bonusMove}</span>` : '';
  const hpRatio = unit.hp / unit.maxHp;
  const hpCol = hpColor(hpRatio);

  let tags = '';
  if (unit.isDrone) tags += '<span class="unit-tag drone">Drone</span>';
  if (unit.salvageTokens > 0) tags += `<span class="unit-tag salvage">Salvage ×${unit.salvageTokens}</span>`;

  panel.innerHTML = `
    <div class="unit-identity">
      <span class="unit-icon" style="color:${color}">${unit.icon}</span>
      <div>
        <div class="unit-name" style="color:${color}">${unit.name}</div>
        <div class="unit-type">${isPlayer ? FACTIONS[state.faction].name : 'Enemy'}</div>
      </div>
    </div>
    <div class="stat-divider"></div>
    <div class="stats-row">
      <div class="stat-block">
        <span class="stat-label">HP</span>
        <span class="stat-value" style="color:${hpCol}">${unit.hp}<span style="color:#7d8590;font-size:12px;font-weight:400">/${unit.maxHp}</span></span>
        <div class="hp-bar-wrap"><div class="hp-bar-fill" style="width:${hpRatio * 100}%;background:${hpCol}"></div></div>
      </div>
      <div class="stat-block">
        <span class="stat-label">ATK</span>
        <span class="stat-value">${totalAtk}${atkBonus}</span>
      </div>
      <div class="stat-block">
        <span class="stat-label">Armor</span>
        <span class="stat-value">${totalArmor}${armorBonus}</span>
      </div>
      <div class="stat-block">
        <span class="stat-label">Move</span>
        <span class="stat-value">${totalMove}${moveBonus}</span>
      </div>
      <div class="stat-block">
        <span class="stat-label">Range</span>
        <span class="stat-value">${unit.range}</span>
      </div>
    </div>
    ${tags ? `<div class="stat-divider"></div><div class="unit-tags">${tags}</div>` : ''}
  `;
  panel.classList.add('visible');
}


function hpColor(ratio) {
  if (ratio > 0.6) return '#3fb950';
  if (ratio > 0.3) return '#d29922';
  return '#f85149';
}

function showDamagePopup(x, y, amount, color) {
  Renderer.showDamagePopup(x, y, amount, color);
}

function showKillFlash(x, y) {
  Renderer.showKillFlash(x, y);
}

// ============================================================
// INPUT
// ============================================================
function onCellClick(x, y) {
  if (state.phase !== 'player_turn' || state.gameOver || animating) return;

  const clickedPlayer = state.playerUnits.find(u => u.hp > 0 && u.pos.x === x && u.pos.y === y);
  const clickedEnemy = state.enemies.find(u => u.hp > 0 && u.pos.x === x && u.pos.y === y);

  // Move phase: click valid move tile
  if (state.selectedPhase === 'move' && state.moveTargets.some(t => t.x === x && t.y === y)) {
    moveUnit(state.selectedUnit, x, y);
    return;
  }

  // Attack phase: click valid attack target
  if (state.selectedPhase === 'attack' && clickedEnemy && state.attackTargets.includes(clickedEnemy)) {
    attackTarget(state.selectedUnit, clickedEnemy);
    return;
  }

  // Click selected unit in move phase = skip to attack
  if (state.selectedPhase === 'move' && clickedPlayer === state.selectedUnit) {
    state.selectedPhase = 'attack';
    state.moveTargets = [];
    state.attackTargets = getAttackTargets(state.selectedUnit);
    if (state.attackTargets.length === 0) {
      state.selectedUnit.acted = true;
      deselectUnit();
      checkAllActed();
    } else if (state.attackTargets.length === 1) {
      render();
      const unit = state.selectedUnit;
      attackTarget(unit, state.attackTargets[0]);
    } else {
      render();
      showPrompt('Multiple targets \u2014 click an enemy to attack');
    }
    return;
  }

  // Click selected unit in attack phase = skip attack
  if (state.selectedPhase === 'attack' && clickedPlayer === state.selectedUnit) {
    state.selectedUnit.acted = true;
    deselectUnit();
    checkAllActed();
    return;
  }

  // Click a different friendly unit = select it
  if (clickedPlayer && !clickedPlayer.acted) {
    selectUnit(clickedPlayer);
    return;
  }

  // Click enemy to inspect
  if (clickedEnemy && !state.selectedUnit) {
    renderEnemyDetail(clickedEnemy);
    return;
  }

  deselectUnit();
}

function renderEnemyDetail(enemy) {
  const panel = document.getElementById('bottom-panel');
  const color = enemy.color || '#ff5555';
  const hpRatio = enemy.hp / enemy.maxHp;
  const hpCol = hpColor(hpRatio);
  panel.innerHTML = `
    <div class="unit-identity">
      <span class="unit-icon" style="color:${color}">${enemy.icon}</span>
      <div>
        <div class="unit-name" style="color:${color}">${enemy.name}</div>
        <div class="unit-type">Enemy</div>
      </div>
    </div>
    <div class="stat-divider"></div>
    <div class="stats-row">
      <div class="stat-block">
        <span class="stat-label">HP</span>
        <span class="stat-value" style="color:${hpCol}">${enemy.hp}<span style="color:#7d8590;font-size:12px;font-weight:400">/${enemy.maxHp}</span></span>
        <div class="hp-bar-wrap"><div class="hp-bar-fill" style="width:${hpRatio * 100}%;background:${hpCol}"></div></div>
      </div>
      <div class="stat-block">
        <span class="stat-label">ATK</span>
        <span class="stat-value">${enemy.atk}</span>
      </div>
      <div class="stat-block">
        <span class="stat-label">Armor</span>
        <span class="stat-value">${enemy.armor}</span>
      </div>
      <div class="stat-block">
        <span class="stat-label">Move</span>
        <span class="stat-value">${enemy.move}</span>
      </div>
      <div class="stat-block">
        <span class="stat-label">Range</span>
        <span class="stat-value">${enemy.range}</span>
      </div>
    </div>
  `;
  panel.classList.add('visible');
}

// ============================================================
// UI HELPERS
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showOverlay(title, subtitle, callback) {
  const overlay = createOverlay();
  overlay.innerHTML = `
    <h2>${title}</h2>
    <div class="sub">${subtitle}</div>
    <button class="btn primary" id="overlay-btn">Begin</button>
  `;
  document.body.appendChild(overlay);
  document.getElementById('overlay-btn').addEventListener('click', () => {
    overlay.remove();
    callback();
  });
}

function createOverlay(extraClass) {
  const el = document.createElement('div');
  el.className = 'overlay' + (extraClass ? ' ' + extraClass : '');
  return el;
}

function showPrompt(msg) {
  const existing = document.getElementById('game-prompt');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'game-prompt';
  el.textContent = msg;
  el.style.cssText = 'position:fixed;top:56px;left:50%;transform:translateX(-50%);padding:8px 20px;background:#ffd700;color:#0d1117;font-weight:700;font-size:14px;border-radius:6px;z-index:50;animation:fade-in 0.2s;pointer-events:none;';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
